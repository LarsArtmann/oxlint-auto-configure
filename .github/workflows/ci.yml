name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Configure GOPRIVATE
        run: git config --global url."ssh://git@github.com/LarsArtmann/".insteadOf "https://github.com/LarsArtmann/"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install oxlint
        run: |
          npm install -g oxlint

      - name: Tidy
        env:
          GOPRIVATE: github.com/LarsArtmann/*
        run: go mod tidy

      - name: Build
        env:
          GOPRIVATE: github.com/LarsArtmann/*
        run: go build -v ./...

      - name: Test
        env:
          GOPRIVATE: github.com/LarsArtmann/*
        run: go test -race -coverprofile=coverage.out ./pkg/... ./internal/...

      - name: Coverage
        run: go tool cover -func=coverage.out

      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Configure GOPRIVATE
        run: git config --global url."ssh://git@github.com/LarsArtmann/".insteadOf "https://github.com/LarsArtmann/"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: golangci/golangci-lint-action@v7
        env:
          GOPRIVATE: github.com/LarsArtmann/*
        with:
          version: latest
          args: --timeout=5m

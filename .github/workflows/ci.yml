name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOEXPERIMENT: jsonv2
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install oxlint (pinned to the embedded rules version)
        run: npm install -g "oxlint@$(cat pkg/rule/rules_version.txt)"

      - name: Verify embedded rules match installed oxlint
        run: |
          installed="$(oxlint --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          embedded="$(cat pkg/rule/rules_version.txt)"
          if [ "$installed" != "$embedded" ]; then
            echo "::error::installed oxlint ($installed) does not match the embedded rules version ($embedded)"
            echo "::error::refresh with: oxlint -f json --rules > pkg/rule/rules_data.json and bump pkg/rule/rules_version.txt"
            exit 1
          fi

      - name: Tidy
        run: go mod tidy

      - name: Verify module consistency
        run: git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./pkg/... ./internal/...

      - name: Coverage
        run: go tool cover -func=coverage.out

      - name: Vet
        run: go vet ./...

    timeout-minutes: 15
  security:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Tidy
        run: go mod tidy

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

    timeout-minutes: 15
  lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.13.2
          args: --timeout=5m
    timeout-minutes: 15
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Flake check
        run: nix flake check
    timeout-minutes: 20
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

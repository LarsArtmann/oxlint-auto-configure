name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/LarsArtmann/*
      GOWORK: off
      GOEXPERIMENT: jsonv2
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Configure GOPRIVATE
        run: git config --global url."ssh://git@github.com/LarsArtmann/".insteadOf "https://github.com/LarsArtmann/"

      - name: Install SSH key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install oxlint
        run: |
          pnpm add -g oxlint

      - name: Tidy
        env:
          GOPRIVATE: github.com/LarsArtmann/*
        run: go mod tidy

      - name: Verify module consistency
        run: git diff --exit-code go.mod go.sum

      - name: Build
        env:
          GOPRIVATE: github.com/LarsArtmann/*
        run: go build -v ./...

      - name: Test
        env:
          GOPRIVATE: github.com/LarsArtmann/*
        run: go test -race -coverprofile=coverage.out ./pkg/... ./internal/...

      - name: Coverage
        run: go tool cover -func=coverage.out

      - name: Vet
        run: go vet ./...

    timeout-minutes: 15
  security:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/LarsArtmann/*
      GOWORK: off
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Configure GOPRIVATE
        run: git config --global url."ssh://git@github.com/LarsArtmann/".insteadOf "https://github.com/LarsArtmann/"

      - name: Install SSH key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Tidy
        env:
          GOPRIVATE: github.com/LarsArtmann/*
        run: go mod tidy

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    timeout-minutes: 15
  lint:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/LarsArtmann/*
      GOWORK: off
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Configure GOPRIVATE
        run: git config --global url."ssh://git@github.com/LarsArtmann/".insteadOf "https://github.com/LarsArtmann/"

      - name: Install SSH key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        env:
          GOPRIVATE: github.com/LarsArtmann/*
        with:
          version: v2.12.2
          args: --timeout=5m
    timeout-minutes: 15
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure SSH for private deps
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Flake check
        run: nix flake check --systems x86_64-linux
    timeout-minutes: 20
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

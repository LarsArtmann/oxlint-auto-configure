name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOEXPERIMENT: jsonv2
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install oxlint (pinned to the embedded rules version)
        run: npm install -g "oxlint@$(cat pkg/rule/rules_version.txt)"

      - name: Verify embedded rules match installed oxlint
        run: |
          installed="$(oxlint --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          embedded="$(cat pkg/rule/rules_version.txt)"
          if [ "$installed" != "$embedded" ]; then
            echo "::error::installed oxlint ($installed) does not match the embedded rules version ($embedded)"
            echo "::error::refresh with: oxlint -f json --rules > pkg/rule/rules_data.json and bump pkg/rule/rules_version.txt"
            exit 1
          fi

      - name: Tidy
        run: go mod tidy

      - name: Verify module consistency
        run: git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./pkg/... ./internal/...

      - name: Coverage
        run: go tool cover -func=coverage.out

      - name: Vet
        run: go vet ./...

    timeout-minutes: 15
  security:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Tidy
        run: go mod tidy

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

    timeout-minutes: 15
  lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
    timeout-minutes: 15
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Flake check
        run: nix flake check
    timeout-minutes: 20
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

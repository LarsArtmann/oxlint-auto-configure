version: "2"
run:
  timeout: 5m
  go: "1.26.5"
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    cyclop:
      max-complexity: 12
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - $module
            - github.com/spf13/cobra
            - github.com/stretchr
            - github.com/larsartmann
            - github.com/LarsArtmann
    exhaustruct:
      exclude:
        - os/exec.Cmd
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    goconst:
      ignore-tests: true
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    makezero:
      always: true
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    tagliatelle:
      case:
        rules:
          json: snake
    testifylint:
      disable:
        - go-require
      enable-all: true
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
        - d
        - c
        - r
        - p
        - f
        - sv
        - w
        - n
        - s
        - k
        - pc
        - bv
        - av
        - f1
        - f2
      ignore-type-assert-ok: true
  exclusions:
    generated: lax
    rules:
      - text: cobra.Command is missing
        linters:
          - exhaustruct
      - text: slog[.].*is missing
        linters:
          - exhaustruct
      - text: exec[.]ExitError is missing
        linters:
          - exhaustruct
      - text: finding[.]Position is missing
        linters:
          - exhaustruct
      - text: config[.]OxlintConfig is missing
        linters:
          - exhaustruct
      - text: rule[.]Rule is missing
        linters:
          - exhaustruct
      - text: oxlint[.]
        linters:
          - exhaustruct
      - text: format[.]FindingView is missing
        linters:
          - exhaustruct
      - text: pipeline[.]PipelineResult is missing
        linters:
          - exhaustruct
      - text: finding[.]ToolInfo is missing
        linters:
          - exhaustruct
      - text: G204
        source: exec.Command
        linters:
          - gosec
      - text: G304
        linters:
          - gosec
      - path: _test[.]go$
        text: G306
        linters:
          - gosec
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
      - path: _test\.go
        text: unused
        linters:
          - unused
      - path: internal/cli/cmd_.*\.go$
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - err113
          - mnd
      - text: devDependencies
        linters:
          - tagliatelle
    paths:
      - \.gen\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
    - swaggo
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10

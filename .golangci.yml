version: "2"
run:
  timeout: 5m
  go: 1.26.4
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - copyloopvar
    - cyclop
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - interfacebloat
    - intrange
    - maintidx
    - mirror
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sloglint
    - spancheck
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 12
    exhaustruct:
      exclude:
        - os/exec.Cmd
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
  exclusions:
    generated: lax
    rules:
      - text: cobra.Command is missing
        linters:
          - exhaustruct
      - text: slog[.].*is missing
        linters:
          - exhaustruct
      - text: exec[.]ExitError is missing
        linters:
          - exhaustruct
      - text: finding[.]Position is missing
        linters:
          - exhaustruct
      - text: config[.]OxlintConfig is missing
        linters:
          - exhaustruct
      - text: rule[.]Rule is missing
        linters:
          - exhaustruct
      - text: oxlint[.]
        linters:
          - exhaustruct
      - text: format[.]FindingView is missing
        linters:
          - exhaustruct
      - text: pipeline[.]PipelineResult is missing
        linters:
          - exhaustruct
      - text: finding[.]ToolInfo is missing
        linters:
          - exhaustruct
      - text: G204
        source: exec.Command
        linters:
          - gosec
      - text: G304
        linters:
          - gosec
      - path: _test[.]go$
        text: G306
        linters:
          - gosec
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
